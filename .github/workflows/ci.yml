name: CI / CD & E2E Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Biome Linter & Formatter Check
        run: npm run lint

      - name: Run Unit & Contract Tests
        run: npm test

      - name: Run End-to-End (E2E) Pipeline Tests
        run: npm run test:e2e

      - name: Build ESM & Declaration Bundle
        run: npm run build
